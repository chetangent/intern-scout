[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intern-scout"
version = "0.1.0"
description = "Human-in-the-loop internship discovery and ranking for Singapore tech roles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
intern-scout = "intern_scout.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

