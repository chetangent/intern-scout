name: Refresh and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Initialise curated opportunities
        run: PYTHONPATH=src python -m intern_scout.cli init --profile data/profile.public.json
      - name: Refresh official sources
        continue-on-error: true
        run: PYTHONPATH=src python -m intern_scout.cli refresh --profile data/profile.public.json
      - name: Export privacy-safe site data
        run: PYTHONPATH=src python -m intern_scout.cli export-site --profile data/profile.public.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

